name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dmmonitor
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: dmmonitor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dmmonitor -d dmmonitor_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci && npm run build
        working-directory: web
      - run: go test -race ./... && go vet ./... && go build ./cmd/server
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://dmmonitor:test_only@localhost:5432/dmmonitor_test?sslmode=disable
