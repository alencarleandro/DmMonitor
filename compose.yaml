services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dmmonitor
      POSTGRES_USER: dmmonitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmmonitor_local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dmmonitor_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmmonitor -d dmmonitor"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    profiles: [full]
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_URL: ${DOCKER_PUBLIC_URL:-http://127.0.0.1:8087}
      DATABASE_URL: postgres://dmmonitor:${POSTGRES_PASSWORD:-dmmonitor_local}@postgres:5432/dmmonitor?sslmode=disable
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  dmmonitor_pg:
